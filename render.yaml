# Render Blueprint: the website + Tulsi chat API + shop API from one Node web service.
# The PostgreSQL database (customers, orders, payments) is hosted separately, for now on
# Neon's free plan; the service connects to it through DATABASE_URL.
#
# IMPORTANT before taking real orders:
#   - move the web service off the free plan (free instances sleep, so checkout is slow and
#     Razorpay webhooks can be missed)
#   - keep the web service and the database close together (Singapore is closest to India);
#     a service's region cannot be changed after it is created
#   build: installs dependencies and builds the React site into dist/
#   start: `npm start` runs server/index.js, which serves dist/ (with SPA fallback
#          to index.html) and the chat API (/api/chat, /api/health) on Render's $PORT.
#
# The old static-site service cannot be converted to a web service, so this blueprint
# creates a NEW service (different name). Point your domain at it once it is live,
# then delete the old static site.
services:
  - type: web
    name: transzlife-web
    runtime: node
    plan: free                      # free instances sleep when idle (~1 min cold start); use starter or above to avoid that
    buildCommand: npm ci --include=dev && npm run build   # vite and friends are devDependencies
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # `npm start` uses node --env-file-if-exists, which needs Node 22.9+
      - key: NODE_VERSION
        value: "22"
      # ---- Gemini (primary) ----
      # Up to 4 keys, comma-separated. Render asks for the value when you create the
      # service from this blueprint; it is never stored in git.
      - key: GEMINI_API_KEYS
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      # ---- Ollama (fallback) ----
      # Render cannot run Ollama. Leave this empty and the chat uses Gemini only;
      # when all keys are out of quota visitors see "can't connect" until it refreshes.
      # To keep the fallback, run Ollama elsewhere (e.g. your PC behind a Cloudflare
      # tunnel) and put its public URL here.
      - key: OLLAMA_URL
        sync: false
      - key: CHAT_MODEL
        value: gemma2:9b
      # ---- Shop backend ----
      # PostgreSQL connection URL. For now: Neon's free plan (neon.tech, Singapore region);
      # paste its connection string here when Render asks. Later this can point at any Postgres.
      - key: DATABASE_URL
        sync: false
      # Neon's direct (non-pooled) URL, used only for schema migrations at startup
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # Razorpay: empty = Cash on delivery only. Use rzp_test_ keys until the account is live.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # Twilio: sign-in codes (Verify) and order updates. Customers cannot sign in until set.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false
      - key: TWILIO_MESSAGING_SERVICE_SID
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: ORDER_NOTIFICATIONS
        value: "off"
      - key: SITE_URL
        sync: false
      # The site's own address(es), comma-separated: only these may send changes to the API (cross-site protection)
      - key: SITE_ORIGIN
        sync: false
      # Neon Object Storage (product photos, review photos, licence documents): `neon env pull` on the production branch
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_REGION
        value: ap-southeast-1
