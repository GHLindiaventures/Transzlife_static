<!--
  TEMPLATE NOTES
  - Every empty element with class "slot" is a placeholder for text. Fill it with your own copy.
  - Every element with class "media" is a placeholder for an image / video. Put an <img> or <video>

  - Remove class "show-slots" from <body> to hide the dashed guide outlines.
-->

<!-- ============ ANNOUNCEMENT BAR ============ -->

      <span class="slot slot--announce"></span><span class="slot slot--announce"></span><span class="slot slot--announce"></span>

    </div>
  </section>

  <hr class="sep">

  <!-- ============ 14. NEWSLETTER ============ -->
  <section class="news">
    <div class="media media--fill news__bg"></div>
    <div class="news__card" data-reveal>

      <p class="slot slot--news-p"></p>
      <form class="news__form" onsubmit="return false">
        <label class="news__field"><span class="visually-hidden">Email</span><input type="email" autocomplete="email"></label>
        <button class="btn btn--dark news__send" type="submit"><span class="slot slot--btn-sm"></span></button>
      </form>
    </div>
  </section>
